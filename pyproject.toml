[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpasskey"
dynamic = ["version"]
description = "Reusable FastAPI passkey routes, browser client, templates, and WebAuthn core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "webauthn>=2.7.1",
]

[project.optional-dependencies]
dev = [
  "black==25.12.0",
  "flake8>=7.1.0",
  "httpx>=0.27.0",
  "invoke>=2.2.0",
  "itsdangerous>=2.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastpasskey = ["static/*.js", "templates/fastpasskey/*.html"]

[tool.setuptools_scm]
fallback_version = "0.0.dev0"
tag_regex = "^fastpasskey-v(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.pytest.ini_options]
addopts = "-q --cov=fastpasskey --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
