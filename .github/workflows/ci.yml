name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m invoke check-python
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: python -m invoke install-js
      - run: python -m invoke check-js

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: python -m invoke install-js
      - run: python -m invoke install-browser --with-deps
      - run: python -m invoke browser-e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fastpasskey-browser-e2e
          path: e2e-artifacts
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, browser, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fastpasskey-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Determine release version
        id: version
        run: |
          current_tag="$(git tag --points-at "$GITHUB_SHA" --list 'fastpasskey-v*' | sort -V | tail -n 1)"
          if [[ -n "$current_tag" ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "version=${current_tag#fastpasskey-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${current_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_tag="$(git tag --list 'fastpasskey-v*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            version="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest_tag#fastpasskey-v}"
            version="${major}.${minor}.$((patch + 1))"
          fi
          echo "existing=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=fastpasskey-v${version}" >> "$GITHUB_OUTPUT"
      - name: Build wheel and checksum
        if: steps.version.outputs.existing == 'false'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FASTPASSKEY: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install build
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          python -m build --wheel
          npm version "${SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FASTPASSKEY}" --no-git-tag-version
          npm pack --pack-destination dist
          for artifact in dist/*.whl dist/*.tgz; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
      - name: Publish GitHub Release
        if: steps.version.outputs.existing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tgz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FastPasskey v${VERSION}" \
            --generate-notes
