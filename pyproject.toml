[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpasskey"
version = "0.1.0"
description = "Framework-neutral WebAuthn passkey ceremony helpers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "webauthn>=2.7.1",
]

[project.optional-dependencies]
dev = [
  "black==25.12.0",
  "flake8>=7.1.0",
  "invoke>=2.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=fastpasskey --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
